packages:
  - apps/*
  - packages/*
  - examples/llm-remotion-title

# Resolve ffmpeg-video-composer to the copy in this repo whenever its version satisfies the range the
# dependent declares, instead of downloading it. pnpm 10 flipped this default to false and moved the
# setting here from .npmrc, where it is now silently ignored.
#
# @leclap/cli and @leclap/mcp declare that dependency as a plain semver range rather than
# `workspace:*` on purpose: the protocol is rewritten only when *pnpm* packs, and both
# A hand-run `npm publish` shells out to npm, which ships the literal string
# "workspace:*". Four releases went out that way and could not be installed at all. A semver range
# cannot be published wrong; this setting is what keeps local development linked to the source.
linkWorkspacePackages: true

# Moti's declarations import React Native, but its manifest omits that peer.
# Resolve it alongside the consuming app instead of an unrelated hoisted RN version.
packageExtensions:
  moti@0.30.0:
    peerDependencies:
      react-native: '*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@56.1.14'
  - '@expo/fingerprint@0.19.4'
  - '@expo/inline-modules@0.0.11'
  - '@expo/metro-runtime@56.0.14'
  - '@expo/prebuild-config@56.0.15'
  - '@expo/router-server@56.0.13'
  - '@expo/ui@56.0.16'
  - '@radix-ui/react-compose-refs@1.1.3'
  - '@radix-ui/react-slot@1.2.5'
  - '@types/node@25.9.2'
  - '@types/react@19.2.17'
  - expo-asset@56.0.16
  - expo-constants@56.0.17
  - expo-modules-autolinking@56.0.15
  - expo-modules-core@56.0.15
  - expo-modules-jsi@56.0.8
  - expo-router@56.2.9
  - expo-server@56.0.5
  - expo-symbols@56.0.6
  - expo@56.0.9
  - caniuse-lite@1.0.30001797
  - '@vitejs/plugin-react@6.0.3'
  - vite@8.1.0
  - typescript@7.0.2
  # Temporary: the MCP SDK v1 → v2 rename (@modelcontextprotocol/sdk → /server + /client).
  # Both were published 2026-07-27, inside the minimum-release-age window, so the install can't
  # resolve them without an exception. Drop these two lines once they age past the window.
  - '@modelcontextprotocol/server@2.0.0'
  - '@modelcontextprotocol/client@2.0.0'
  # Temporary: Vite+ 1.0.0 and its core/native binaries were published 2026-09-28, inside the
  # minimum-release-age window. Drop these lines once they age past it.
  - vite-plus@1.0.0
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
